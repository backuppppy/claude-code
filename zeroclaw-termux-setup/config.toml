schema_version = 3

# Agent configuration: agggeeeenttt (YOLO Mode)
[agents.agggeeeenttt]
risk_profile = "permissive"
runtime_profile = "unbounded"
model_provider = "anthropic.default"
max_tool_iterations = 15
step_timeout_secs = 300

# Memory configuration
[memory]
backend = "sqlite.sqlite"

# Risk profile: permissive (YOLO - no approval prompts)
[risk_profiles.permissive]
require_approval_for_medium_risk = false
sandbox_enabled = false
workspace_only = false
allowed_commands = ["*"]

[risk_profiles.permissive.delegation_policy]
mode = "allow"

# Onboarding completed
[onboard_state]
quickstart_completed = true

# Anthropic Claude API configuration
[providers.models.anthropic.default]
model = "claude-opus-5"
api_key = "sk-ant-api03-REPLACE_WITH_YOUR_KEY"
timeout_secs = 300

# Optional: GitHub integration
[providers.git_forge.github]
provider = "github"
# token stored via `gh auth login` or in config
