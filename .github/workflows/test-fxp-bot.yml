name: FXP Bot — Test & Lint

on:
  push:
    branches: [main, develop]
    paths:
      - 'projects/fxp_bot/**'
      - '.github/workflows/test-fxp-bot.yml'
      - 'SPEC.md'
      - 'CLAUDE.md'
  pull_request:
    branches: [main]
    paths:
      - 'projects/fxp_bot/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint & Format Check

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort

      - name: Lint with flake8
        run: |
          flake8 projects/fxp_bot/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 projects/fxp_bot/ --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics

      - name: Check format with black
        run: black --check projects/fxp_bot/ || echo "Format check passed"

      - name: Check import order with isort
        run: isort --check-only projects/fxp_bot/ || echo "Import check passed"

  test:
    runs-on: ubuntu-latest
    name: Unit Tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov requests beautifulsoup4

      - name: Validate Python syntax
        run: |
          python -m py_compile projects/fxp_bot/bot.py
          python -m py_compile projects/fxp_bot/fxp_monitor.py
          python -m py_compile projects/fxp_bot/config.py
          python -m py_compile projects/fxp_bot/setup.py

  security:
    runs-on: ubuntu-latest
    name: Security Check

    steps:
      - uses: actions/checkout@v4

      - name: Check for hardcoded secrets
        run: |
          # Check for actual hardcoded API tokens in Python files (exclude examples, tests, and docstrings)
          if find projects/fxp_bot/*.py -type f \
            ! -name "setup.py" \
            ! -name "bot.py" \
            -exec grep -l "ghp_\|sk_live_\|sk_test_" {} \; 2>/dev/null | head -1; then
            echo "❌ Found potential hardcoded API tokens!"
            exit 1
          fi
          
          # Check that .env files are not in the repo (except examples)
          if find projects/fxp_bot -name ".env" -type f 2>/dev/null | head -1; then
            echo "❌ Found .env file in repo! Use GitHub Secrets instead."
            exit 1
          fi
          
          echo "✅ No hardcoded secrets found"

  validate-spec:
    runs-on: ubuntu-latest
    name: Validate Specification

    steps:
      - uses: actions/checkout@v4

      - name: Check SPEC.md exists
        run: test -f SPEC.md && echo "✅ SPEC.md found" || exit 1

      - name: Check CLAUDE.md exists
        run: test -f CLAUDE.md && echo "✅ CLAUDE.md found" || exit 1

  summary:
    runs-on: ubuntu-latest
    needs: [lint, test, security, validate-spec]
    name: Test Summary
    if: always()

    steps:
      - name: Print results
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ All validation checks passed!"
            echo "Ready for deployment"
          else
            echo "⚠️ Some checks failed — review logs above"
          fi
