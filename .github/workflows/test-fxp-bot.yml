name: FXP Bot — Test & Lint

on:
  push:
    branches: [main, develop]
    paths:
      - 'projects/fxp_bot/**'
      - '.github/workflows/test-fxp-bot.yml'
      - 'SPEC.md'
      - 'CLAUDE.md'
  pull_request:
    branches: [main]
    paths:
      - 'projects/fxp_bot/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint & Format Check

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install linter
        run: pip install flake8 black isort

      - name: Lint with flake8
        run: flake8 projects/fxp_bot/ --max-line-length=100 || true

  test:
    runs-on: ubuntu-latest
    name: Syntax Check

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Check Python syntax
        run: |
          python -m py_compile projects/fxp_bot/bot.py
          python -m py_compile projects/fxp_bot/fxp_monitor.py
          python -m py_compile projects/fxp_bot/config.py
          echo "✅ Syntax OK"

  security:
    runs-on: ubuntu-latest
    name: Security Check

    steps:
      - uses: actions/checkout@v4

      - name: Verify .env not committed
        run: |
          if [ -f "projects/fxp_bot/.env" ]; then
            echo "❌ ERROR: .env file should not be in repo! Use GitHub Secrets."
            exit 1
          fi
          echo "✅ Security check passed"

  spec:
    runs-on: ubuntu-latest
    name: Validate Spec

    steps:
      - uses: actions/checkout@v4

      - name: Check documentation
        run: |
          test -f SPEC.md && echo "✅ SPEC.md" || exit 1
          test -f CLAUDE.md && echo "✅ CLAUDE.md" || exit 1
