name: Restore secrets to files

# הרצה ידנית בלבד. משחזר את כל הסודות לקבצים ומעלה כ-artifact להורדה.
# ⚠️ ה-artifact מכיל ערכים רגישים — מחקו אותו אחרי ההורדה.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Write secrets to files
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FXP_TELEGRAM_TOKEN: ${{ secrets.FXP_TELEGRAM_TOKEN }}
          FXP_TELEGRAM_CHAT_ID: ${{ secrets.FXP_TELEGRAM_CHAT_ID }}
          STORYTEL_USERNAME: ${{ secrets.STORYTEL_USERNAME }}
          STORYTEL_PASSWORD: ${{ secrets.STORYTEL_PASSWORD }}
          CLAUDE_JSON_B64: ${{ secrets.CLAUDE_JSON_B64 }}
          GITCONFIG_B64: ${{ secrets.GITCONFIG_B64 }}
        run: |
          mkdir -p restored
          printf '%s\n' "$GH_TOKEN" > restored/.gh_token

          printf "OPENROUTER_API_KEY='%s'\n" "$OPENROUTER_API_KEY" > restored/godmod3.env

          {
            printf 'TELEGRAM_TOKEN=%s\n' "$FXP_TELEGRAM_TOKEN"
            printf 'TELEGRAM_CHAT_ID=%s\n' "$FXP_TELEGRAM_CHAT_ID"
            printf 'CHECK_INTERVAL=120\n'
          } > restored/fxp.env

          {
            printf '[sources.storytel]\n'
            printf 'username = "%s"\n' "$STORYTEL_USERNAME"
            printf 'password = "%s"\n' "$STORYTEL_PASSWORD"
          } > restored/audiobook-dl.toml

          printf '%s' "$CLAUDE_JSON_B64"  > restored/claude.json.b64
          printf '%s' "$GITCONFIG_B64"    > restored/gitconfig.b64

      - name: Upload restored secrets artifact
        uses: actions/upload-artifact@v4
        with:
          name: restored-secrets
          path: restored/
          retention-days: 1
